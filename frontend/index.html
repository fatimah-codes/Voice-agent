<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MindAI Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=block">
  <style>
:root {
  --ink: #000000;
  --bg: #F6EAF2;
  --hairline: rgba(0, 0, 0, 0.28);
  --glass: rgba(255, 255, 255, 0.28);
  --glass-card: rgba(255, 255, 255, 0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Questrial', system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  position: relative;
}

/* ==========================================================================
   BACKGROUND ANIMATION SCENE (Aurora Blobs, Cognitive Rings, Twinkle Stars)
   ========================================================================== */
.bg-scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

/* Iridescent Aurora Gradient Blobs */
.aurora-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  mix-blend-mode: multiply;
  will-change: transform;
}

.blob-1 {
  width: 50vw;
  height: 50vw;
  top: -15%;
  left: -10%;
  background: radial-gradient(circle, rgba(255, 175, 215, 0.7) 0%, rgba(255, 205, 230, 0.2) 70%, transparent 100%);
  animation: float-blob-1 18s ease-in-out infinite alternate;
}

.blob-2 {
  width: 55vw;
  height: 55vw;
  bottom: -20%;
  right: -10%;
  background: radial-gradient(circle, rgba(160, 210, 255, 0.65) 0%, rgba(200, 230, 255, 0.2) 70%, transparent 100%);
  animation: float-blob-2 22s ease-in-out infinite alternate;
}

.blob-3 {
  width: 40vw;
  height: 40vw;
  top: 30%;
  right: 15%;
  background: radial-gradient(circle, rgba(215, 180, 255, 0.55) 0%, rgba(240, 210, 255, 0.15) 70%, transparent 100%);
  animation: float-blob-3 15s ease-in-out infinite alternate;
}

.blob-4 {
  width: 35vw;
  height: 35vw;
  bottom: 10%;
  left: 10%;
  background: radial-gradient(circle, rgba(255, 220, 180, 0.5) 0%, rgba(255, 240, 210, 0.2) 70%, transparent 100%);
  animation: float-blob-4 20s ease-in-out infinite alternate;
}

@keyframes float-blob-1 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(12vw, 8vh) scale(1.12); }
  100% { transform: translate(4vw, 15vh) scale(0.95); }
}

@keyframes float-blob-2 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-10vw, -12vh) scale(1.1); }
  100% { transform: translate(-5vw, -5vh) scale(0.92); }
}

@keyframes float-blob-3 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-8vw, 10vh) scale(1.15); }
  100% { transform: translate(-15vw, -6vh) scale(0.9); }
}

@keyframes float-blob-4 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(10vw, -10vh) scale(1.18); }
  100% { transform: translate(18vw, 6vh) scale(0.92); }
}

/* Ambient Concentric Soundwave / Cognitive Ripples */
.concentric-rings {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(90vw, 750px);
  height: min(90vw, 750px);
  pointer-events: none;
  z-index: 2;
}

.c-ring {
  position: absolute;
  inset: 0;
  margin: auto;
  border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, 0.06);
  transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.ring-1 { width: 55%; height: 55%; animation: ring-pulse 6s infinite ease-in-out; }
.ring-2 { width: 75%; height: 75%; animation: ring-pulse 8s infinite ease-in-out 1.5s; }
.ring-3 { width: 95%; height: 95%; animation: ring-pulse 10s infinite ease-in-out 3s; }

body[data-state="listening"] .c-ring {
  border-color: rgba(229, 57, 53, 0.18);
  animation-duration: 2s !important;
}

body[data-state="thinking"] .c-ring {
  border-color: rgba(142, 36, 170, 0.22);
  animation-duration: 2.5s !important;
}

body[data-state="speaking"] .c-ring {
  border-color: rgba(30, 136, 229, 0.25);
  animation-duration: 1.6s !important;
}

@keyframes ring-pulse {
  0% { transform: scale(0.96); opacity: 0.3; }
  50% { transform: scale(1.04); opacity: 0.8; }
  100% { transform: scale(0.96); opacity: 0.3; }
}

/* Star Dust Canvas */
.star-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

/* ==========================================================================
   TOP MASTHEAD
   ========================================================================== */
.masthead {
  width: 100%;
  padding: 24px 36px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
}

.icon-btn {
  background: none;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.75;
  transition: opacity 0.2s, transform 0.2s;
  padding: 6px;
  border-radius: 50%;
}
.icon-btn:hover {
  opacity: 1;
  transform: scale(1.08);
}

.logo {
  width: 52px;
  height: 33px;
  cursor: pointer;
}

/* ==========================================================================
   CENTERED 3D FIGURE STAGE
   ========================================================================== */
.stage {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: filter 0.5s ease, opacity 0.5s ease;
}

body.locked .stage {
  filter: blur(14px);
  opacity: 0.45;
  pointer-events: none;
}

.figure-wrapper {
  position: relative;
  width: min(85vw, 540px);
  aspect-ratio: 1049 / 1032;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.figure-wrapper:hover {
  transform: scale(1.02);
}

.figure-wrapper:active {
  transform: scale(0.99);
}

/* Active Aura Rings behind Bust */
.aura-ring {
  position: absolute;
  width: 82%;
  height: 82%;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 1;
}

body[data-state="listening"] .aura-ring {
  opacity: 1;
  background: radial-gradient(circle, rgba(255,140,190,0.45) 0%, rgba(130,210,255,0.25) 50%, transparent 75%);
  animation: aura-pulse 1.8s infinite ease-in-out;
}

body[data-state="thinking"] .aura-ring {
  opacity: 1;
  background: radial-gradient(circle, rgba(200,160,255,0.5) 0%, rgba(255,180,220,0.3) 50%, transparent 75%);
  animation: aura-spin 2.4s infinite linear;
}

body[data-state="speaking"] .aura-ring {
  opacity: 1;
  background: radial-gradient(circle, rgba(140,220,255,0.55) 0%, rgba(255,160,200,0.35) 50%, transparent 75%);
  animation: aura-wave 1.2s infinite ease-in-out;
}

@keyframes aura-pulse {
  0% { transform: scale(0.85); opacity: 0.35; }
  50% { transform: scale(1.18); opacity: 0.8; }
  100% { transform: scale(0.85); opacity: 0.35; }
}

@keyframes aura-spin {
  0% { transform: scale(0.95) rotate(0deg); opacity: 0.4; }
  50% { transform: scale(1.1) rotate(180deg); opacity: 0.75; }
  100% { transform: scale(0.95) rotate(360deg); opacity: 0.4; }
}

@keyframes aura-wave {
  0% { transform: scale(0.9); opacity: 0.45; }
  50% { transform: scale(1.25); opacity: 0.9; }
  100% { transform: scale(0.9); opacity: 0.45; }
}

/* 3D Bust Mask and Video */
.bust-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 9%, #000 100%);
  mask-image:
    linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 9%, #000 100%);
  -webkit-mask-composite: source-in;
  mask-composite: intersect;
  z-index: 2;
  pointer-events: none;
}

.bust-v {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
  display: block;
  filter: brightness(1.18) saturate(1.22);
  mix-blend-mode: multiply;
  transform-origin: 50% 100%;
}

/* Touch Trigger Pill Indicator */
.touch-trigger {
  position: absolute;
  bottom: -46px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 22px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--hairline);
  border-radius: 28px;
  font-size: 14.5px;
  letter-spacing: 0.03em;
  color: #000;
  pointer-events: auto;
  cursor: pointer;
  transition: all 0.3s ease;
  z-index: 10;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
}

.touch-trigger:hover {
  background: rgba(255, 255, 255, 0.45);
  border-color: rgba(0, 0, 0, 0.55);
  transform: translateY(-2px);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #000;
  transition: all 0.3s ease;
}

body[data-state="listening"] .status-dot {
  background: #E53935;
  box-shadow: 0 0 10px #E53935;
  animation: blink 0.8s infinite;
}

body[data-state="thinking"] .status-dot {
  background: #8E24AA;
  box-shadow: 0 0 10px #8E24AA;
  animation: blink 0.6s infinite;
}

body[data-state="speaking"] .status-dot {
  background: #1E88E5;
  box-shadow: 0 0 10px #1E88E5;
  animation: pulse-dot 1s infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.25; transform: scale(0.8); }
}

@keyframes pulse-dot {
  0% { transform: scale(0.9); }
  50% { transform: scale(1.35); }
  100% { transform: scale(0.9); }
}

/* Subtitle for Spoken Response or Error */
.subtitle-bar {
  max-width: 620px;
  width: 90%;
  margin: 0 auto 32px;
  text-align: center;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: 0.02em;
  color: #222;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  z-index: 15;
  pointer-events: none;
}

.subtitle-bar.visible {
  opacity: 0.95 !important;
  transform: translateY(0) !important;
}

.subtitle-bar.error-text {
  color: #C62828 !important;
  font-weight: 500;
}

/* ==========================================================================
   MINIMALIST API KEY GATEWAY (Frosted Glass Modal)
   ========================================================================== */
.key-gate {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  background: rgba(246, 234, 242, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease, transform 0.45s ease;
}

body.locked .key-gate {
  opacity: 1;
  pointer-events: auto;
}

.gate-card {
  width: min(90vw, 420px);
  padding: 38px 32px 34px;
  background: var(--glass-card);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--hairline);
  border-radius: 28px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  transform: scale(0.96);
  transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
}

body.locked .gate-card {
  transform: scale(1);
}

.gate-title {
  font-size: 24px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: #000;
  margin-top: 4px;
}

.gate-sub {
  font-size: 14px;
  color: rgba(0, 0, 0, 0.65);
  line-height: 1.45;
  max-width: 320px;
}

.input-box {
  width: 100%;
  position: relative;
  margin-top: 6px;
}

.key-input {
  width: 100%;
  height: 48px;
  padding: 0 52px 0 20px;
  border-radius: 24px;
  border: 1px solid var(--hairline);
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(8px);
  font-family: inherit;
  font-size: 14.5px;
  color: #000;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}

.key-input:focus {
  border-color: #000;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
}

.key-input::placeholder {
  color: rgba(0, 0, 0, 0.35);
}

.submit-arrow {
  position: absolute;
  right: 6px;
  top: 5px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
}

.submit-arrow:hover {
  transform: scale(1.05);
  opacity: 0.85;
}

.submit-arrow svg {
  width: 16px;
  height: 16px;
  stroke: #fff;
}

.chip-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.sys-chip {
  padding: 6px 16px;
  border-radius: 16px;
  border: 1px solid rgba(0, 0, 0, 0.2);
  background: rgba(255, 255, 255, 0.35);
  font-size: 12.5px;
  color: rgba(0, 0, 0, 0.7);
  cursor: pointer;
  transition: all 0.2s;
}

.sys-chip:hover {
  border-color: #000;
  color: #000;
  background: rgba(255, 255, 255, 0.7);
}

.gate-msg {
  font-size: 12.5px;
  color: #D32F2F;
  min-height: 16px;
}
  </style>
</head>

  <script>
  (function(){
    var body = document.body;
    var figureBox = document.getElementById('figureBox');
    var touchBtn = document.getElementById('touchBtn');
    var statusText = document.getElementById('statusText');
    var subtitleText = document.getElementById('subtitleText');
    var v = document.querySelector('.bust-v');

    var keyGate = document.getElementById('keyGate');
    var apiKeyInput = document.getElementById('apiKeyInput');
    var gateMsg = document.getElementById('gateMsg');
    var keyIconBtn = document.getElementById('keyIconBtn');
    var sysChipRow = document.getElementById('sysChipRow');
    var useSysKeyBtn = document.getElementById('useSysKeyBtn');

    var currentState = 'idle'; // idle, listening, thinking, speaking
    var isUnlocked = true; // default unlocked if system key exists
    var audioCtx = null;
    var mediaStream = null;
    var scriptProcessor = null;
    var dummyGain = null;
    var audioChunks = [];
    var currentAudioPlayer = null;
    var actualSampleRate = 24000;

    // --- Background Twinkle Stardust Canvas ---
    var canvas = document.getElementById('starCanvas');
    var ctx = canvas.getContext('2d');
    var stars = [];
    var w = 0, h = 0;

    function resizeCanvas() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (var s = 0; s < 45; s++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.5 + 0.6,
        alpha: Math.random() * 0.7 + 0.2,
        speed: Math.random() * 0.35 + 0.15,
        twinkleSpeed: Math.random() * 0.02 + 0.01,
        color: ['rgba(255,180,210,', 'rgba(170,215,255,', 'rgba(215,185,255,', 'rgba(255,230,190,'][Math.floor(Math.random() * 4)]
      });
    }

    function renderStars() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var p = stars[i];
        p.y -= p.speed;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        p.alpha += Math.sin(Date.now() * p.twinkleSpeed) * 0.01;
        p.alpha = Math.max(0.15, Math.min(0.85, p.alpha));

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.fill();
      }
      requestAnimationFrame(renderStars);
    }
    renderStars();

    // Anchor first frame of video
    if (v) {
      v.pause();
      function anchorVideo(){
        if (!v.currentTime) v.currentTime = 0.001;
      }
      v.addEventListener('loadeddata', anchorVideo, {once:true});
      if (v.readyState >= 2) anchorVideo();

      // Mouse scrub dial
      var prevX = null;
      var SENSITIVITY = 0.7;
      window.addEventListener('mousemove', function(e){
        if (!isUnlocked || currentState !== 'idle' || !v.duration) return;
        if (prevX === null) { prevX = e.clientX; return; }
        var delta = prevX - e.clientX;
        prevX = e.clientX;
        if (!delta) return;
        var t = v.currentTime + (delta / window.innerWidth) * SENSITIVITY * v.duration;
        v.currentTime = Math.min(Math.max(t, 0), v.duration);
      }, { passive: true });
      document.addEventListener('mouseleave', function(){ prevX = null; });
    }

    // --- State and UI Updates ---
    function setVisualState(state, message) {
      currentState = state;
      body.setAttribute('data-state', state);
      if (message) {
        statusText.textContent = message;
      } else {
        if (state === 'idle') statusText.textContent = 'Tap to speak';
        else if (state === 'listening') statusText.textContent = 'Listening... (Tap to answer)';
        else if (state === 'thinking') statusText.textContent = 'Thinking...';
        else if (state === 'speaking') statusText.textContent = 'Speaking...';
      }
    }

    function unlockApp() {
      isUnlocked = true;
      body.classList.remove('locked');
      gateMsg.textContent = '';
      subtitleText.className = 'subtitle-bar';
    }

    function lockApp(msg) {
      isUnlocked = false;
      body.classList.add('locked');
      if (msg) gateMsg.textContent = msg;
    }

    keyIconBtn.addEventListener('click', function(){
      if (body.classList.contains('locked')) {
        body.classList.remove('locked');
      } else {
        body.classList.add('locked');
      }
    });

    // --- Streamlit Protocol ---
    function sendToStreamlit(data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: data
      }, "*");
    }

    function notifyReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: Math.max(window.innerHeight, 780)
      }, "*");
    }

    notifyReady();
    window.addEventListener('resize', function(){
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: Math.max(window.innerHeight, 780)
      }, "*");
    });

    // Handle messages arriving from Python / Streamlit
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'streamlit:render') return;
      var args = event.data.args || {};

      if (args.has_system_key) {
        sysChipRow.style.display = 'flex';
      }

      if (args.is_authenticated) {
        unlockApp();
      } else {
        lockApp(args.auth_error || '');
      }

      if (args.audio_url && args.status === 'speaking') {
        playResponseAudio(args.audio_url, args.transcript || '');
      } else if (args.status === 'error') {
        setVisualState('idle', 'Tap to retry');
        subtitleText.textContent = args.error_message || 'An error occurred. Tap figure to try again.';
        subtitleText.className = 'subtitle-bar visible error-text';
      }
    });

    // --- API Key Handlers ---
    window.submitKey = function() {
      var key = apiKeyInput.value.trim();
      if (!key) {
        gateMsg.textContent = 'Please enter a valid OpenAI API key.';
        return;
      }
      gateMsg.textContent = 'Authenticating...';
      sendToStreamlit({
        action: 'set_api_key',
        api_key: key,
        timestamp: Date.now()
      });
    };

    useSysKeyBtn.addEventListener('click', function(){
      gateMsg.textContent = 'Connecting with system credential...';
      sendToStreamlit({
        action: 'use_system_key',
        timestamp: Date.now()
      });
    });

    // --- Audio Playback ---
    function playResponseAudio(audioUrl, transcript) {
      if (currentAudioPlayer) {
        currentAudioPlayer.pause();
        currentAudioPlayer = null;
      }

      setVisualState('speaking', 'Speaking...');
      subtitleText.textContent = transcript;
      subtitleText.className = 'subtitle-bar visible';

      if (v) {
        v.playbackRate = 0.85;
        v.play().catch(function(){});
      }

      var player = new Audio(audioUrl);
      currentAudioPlayer = player;

      player.onended = function() {
        if (v) v.pause();
        setVisualState('idle', 'Tap to speak');
        setTimeout(function(){
          subtitleText.className = 'subtitle-bar';
        }, 5000);
      };

      player.onerror = function() {
        if (v) v.pause();
        setVisualState('idle', 'Tap to speak');
      };

      player.play().catch(function(e){
        console.warn('Autoplay prevented:', e);
        if (v) v.pause();
        setVisualState('idle', 'Tap to speak');
      });
    }

    // --- Audio Recording via Web Audio API ---
    async function startListening() {
      if (!isUnlocked) {
        body.classList.add('locked');
        return;
      }
      try {
        audioChunks = [];
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        actualSampleRate = audioCtx.sampleRate || 24000;

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        var source = audioCtx.createMediaStreamSource(mediaStream);

        scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
        scriptProcessor.onaudioprocess = function(e) {
          var input = e.inputBuffer.getChannelData(0);
          audioChunks.push(new Float32Array(input));
        };

        // Silent gain node to avoid acoustic speaker feedback
        dummyGain = audioCtx.createGain();
        dummyGain.gain.value = 0;

        source.connect(scriptProcessor);
        scriptProcessor.connect(dummyGain);
        dummyGain.connect(audioCtx.destination);

        setVisualState('listening', 'Listening... (Tap to answer)');
        subtitleText.className = 'subtitle-bar';
        subtitleText.textContent = '';

        if (v) {
          v.playbackRate = 0.6;
          v.play().catch(function(){});
        }
      } catch (err) {
        console.error('Mic error:', err);
        setVisualState('idle', 'Mic permission needed');
        subtitleText.textContent = 'Microphone access denied or unavailable.';
        subtitleText.className = 'subtitle-bar visible error-text';
      }
    }

    function stopAndSendAudio() {
      setVisualState('thinking', 'Thinking...');
      if (v) v.pause();

      if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
      }
      if (dummyGain) {
        dummyGain.disconnect();
        dummyGain = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(function(track){ track.stop(); });
        mediaStream = null;
      }

      if (!audioChunks || audioChunks.length === 0) {
        setVisualState('idle', 'No speech detected. Tap to speak');
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
        return;
      }

      var totalLen = 0;
      for (var i = 0; i < audioChunks.length; i++) totalLen += audioChunks[i].length;
      var merged = new Float32Array(totalLen);
      var offset = 0;
      for (var j = 0; j < audioChunks.length; j++) {
        merged.set(audioChunks[j], offset);
        offset += audioChunks[j].length;
      }

      var wavBuffer = encodeWAV(merged, actualSampleRate);
      if (audioCtx) { audioCtx.close(); audioCtx = null; }

      // Safe chunked base64 conversion (no stack overflow)
      var b64Wav = bufferToBase64(wavBuffer);

      sendToStreamlit({
        action: 'query',
        audio_b64: b64Wav,
        sample_rate: actualSampleRate,
        timestamp: Date.now()
      });
    }

    function bufferToBase64(buffer) {
      var binary = '';
      var bytes = new Uint8Array(buffer);
      var len = bytes.byteLength;
      var chunkSize = 0x8000;
      for (var i = 0; i < len; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len)));
      }
      return btoa(binary);
    }

    function encodeWAV(samples, sampleRate) {
      var buffer = new ArrayBuffer(44 + samples.length * 2);
      var view = new DataView(buffer);

      function writeString(offset, string) {
        for (var i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM format
      view.setUint16(22, 1, true); // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // byte rate
      view.setUint16(32, 2, true); // block align
      view.setUint16(34, 16, true); // 16-bit
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);

      var offset = 44;
      for (var i = 0; i < samples.length; i++, offset += 2) {
        var s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return buffer;
    }

    function handleFigureTouch() {
      if (!isUnlocked) {
        body.classList.add('locked');
        return;
      }
      if (currentState === 'idle') {
        startListening();
      } else if (currentState === 'listening') {
        stopAndSendAudio();
      } else if (currentState === 'speaking') {
        if (currentAudioPlayer) {
          currentAudioPlayer.pause();
          currentAudioPlayer = null;
        }
        startListening();
      }
    }

    figureBox.addEventListener('click', handleFigureTouch);
    touchBtn.addEventListener('click', function(e){
      e.stopPropagation();
      handleFigureTouch();
    });
  })();
  </script>
</body>
</html>
